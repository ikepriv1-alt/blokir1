          cat > app/src/main/java/com/blokir/takdikenal/MainActivity.kt << 'EOF'
          package com.blokir.takdikenal
          
          import android.Manifest
          import android.app.role.RoleManager
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          
          class MainActivity : AppCompatActivity() {
          
              private lateinit var header: View
              private lateinit var tvIcon: TextView
              private lateinit var tvTitle: TextView
              private lateinit var tvSubtitle: TextView
              private lateinit var tvEmpty: TextView
              private lateinit var btnActivate: View
              private val adapter = BlockedAdapter()
          
              // Dipanggil otomatis setiap ada panggilan baru yang diblokir
              private val logListener = SharedPreferences.OnSharedPreferenceChangeListener { _, _ ->
                  runOnUiThread { refresh() }
              }
          
              private val askContacts =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { refresh() }
              private val askRole =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { refresh() }
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  header = findViewById(R.id.header)
                  tvIcon = findViewById(R.id.icon)
                  tvTitle = findViewById(R.id.title)
                  tvSubtitle = findViewById(R.id.subtitle)
                  tvEmpty = findViewById(R.id.empty)
                  btnActivate = findViewById(R.id.btnActivate)
                  findViewById<RecyclerView>(R.id.list).apply {
                      layoutManager = LinearLayoutManager(this@MainActivity)
                      adapter = this@MainActivity.adapter
                  }
                  btnActivate.setOnClickListener { activate() }
                  findViewById<View>(R.id.btnClear).setOnClickListener {
                      LogStore.clear(this); refresh()
                  }
              }
          
              override fun onStart() {
                  super.onStart()
                  LogStore.prefs(this).registerOnSharedPreferenceChangeListener(logListener)
              }
          
              override fun onStop() {
                  LogStore.prefs(this).unregisterOnSharedPreferenceChangeListener(logListener)
                  super.onStop()
              }
          
              override fun onResume() {
                  super.onResume()
                  refresh()
              }
          
              private fun hasContacts() = ContextCompat.checkSelfPermission(
                  this, Manifest.permission.READ_CONTACTS
              ) == PackageManager.PERMISSION_GRANTED
          
              private fun roleManager() = getSystemService(RoleManager::class.java)
          
              private fun hasRole() = roleManager().isRoleHeld(RoleManager.ROLE_CALL_SCREENING)
          
              private fun activate() {
                  if (!hasContacts()) {
                      askContacts.launch(Manifest.permission.READ_CONTACTS); return
                  }
                  if (!hasRole()) {
                      askRole.launch(roleManager().createRequestRoleIntent(RoleManager.ROLE_CALL_SCREENING))
                  }
              }
          
              private fun refresh() {
                  val active = hasContacts() && hasRole()
                  val list = LogStore.get(this)
          
                  header.setBackgroundResource(if (active) R.drawable.bg_header_on else R.drawable.bg_header_off)
                  tvIcon.text = if (active) "🛡️" else "⚠️"
                  tvTitle.text = if (active) "Perlindungan aktif" else "Belum aktif"
                  tvSubtitle.text = if (active)
                      "${list.size} panggilan tak dikenal diblokir"
                  else
                      "Ketuk tombol di bawah untuk mengaktifkan"
                  btnActivate.visibility = if (active) View.GONE else View.VISIBLE
          
                  adapter.submit(list)
                  tvEmpty.visibility = if (list.isEmpty()) View.VISIBLE else View.GONE
              }
          }
          
          class BlockedAdapter : RecyclerView.Adapter<BlockedAdapter.VH>() {
              private var items: List<LogStore.Entry> = emptyList()
              private val fmt = SimpleDateFormat("dd MMM yyyy, HH:mm", Locale("id", "ID"))
          
              fun submit(list: List<LogStore.Entry>) {
                  items = list
                  notifyDataSetChanged()
              }
          
              class VH(v: View) : RecyclerView.ViewHolder(v) {
                  val number: TextView = v.findViewById(R.id.number)
                  val time: TextView = v.findViewById(R.id.time)
              }
          
              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int) = VH(
                  LayoutInflater.from(parent.context).inflate(R.layout.item_blocked, parent, false)
              )
          
              override fun getItemCount() = items.size
          
              override fun onBindViewHolder(holder: VH, position: Int) {
                  val e = items[position]
                  holder.number.text = e.number
                  holder.time.text = fmt.format(Date(e.time))
              }
          }
          EOF
          cat > app/src/main/java/com/blokir/takdikenal/CallBlockerService.kt << 'EOF'
          package com.blokir.takdikenal
          
          import android.Manifest
          import android.content.Context
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.provider.ContactsContract
          import android.telecom.Call
          import android.telecom.CallScreeningService
          import androidx.core.content.ContextCompat
          
          class CallBlockerService : CallScreeningService() {
          
              override fun onScreenCall(details: Call.Details) {
                  val allow = CallResponse.Builder().build()
          
                  if (details.callDirection != Call.Details.DIRECTION_INCOMING) {
                      respondToCall(details, allow); return
                  }
                  val granted = ContextCompat.checkSelfPermission(
                      this, Manifest.permission.READ_CONTACTS
                  ) == PackageManager.PERMISSION_GRANTED
                  if (!granted) { respondToCall(details, allow); return }
          
                  val number = details.handle?.schemeSpecificPart
                  if (!number.isNullOrBlank() && isInContacts(number)) {
                      respondToCall(details, allow); return
                  }
          
                  LogStore.add(this, if (number.isNullOrBlank()) "Nomor disembunyikan" else number)
                  respondToCall(
                      details,
                      CallResponse.Builder()
                          .setDisallowCall(true)
                          .setRejectCall(true)
                          .setSkipNotification(true)
                          .build()
                  )
              }
          
              private fun isInContacts(number: String): Boolean = try {
                  val uri = Uri.withAppendedPath(
                      ContactsContract.PhoneLookup.CONTENT_FILTER_URI, Uri.encode(number)
                  )
                  contentResolver.query(
                      uri, arrayOf(ContactsContract.PhoneLookup._ID), null, null, null
                  )?.use { it.count > 0 } ?: false
              } catch (e: Exception) {
                  true
              }
          }
          
          object LogStore {
              data class Entry(val time: Long, val number: String)
          
              private const val PREF = "blokir_log"
              private const val KEY = "entries_v2"
              private const val MAX = 200
          
              fun prefs(ctx: Context): SharedPreferences =
                  ctx.getSharedPreferences(PREF, Context.MODE_PRIVATE)
          
              fun add(ctx: Context, number: String) {
                  val line = "${System.currentTimeMillis()}|$number"
                  val updated = (listOf(line) + raw(ctx)).take(MAX)
                  prefs(ctx).edit().putString(KEY, updated.joinToString("\n")).apply()
              }
          
              fun get(ctx: Context): List<Entry> = raw(ctx).mapNotNull { l ->
                  val p = l.split("|", limit = 2)
                  val t = p[0].toLongOrNull()
                  if (p.size == 2 && t != null) Entry(t, p[1]) else null
              }
          
              fun clear(ctx: Context) {
                  prefs(ctx).edit().remove(KEY).apply()
              }
          
              private fun raw(ctx: Context): List<String> {
                  val s = prefs(ctx).getString(KEY, "") ?: ""
                  return if (s.isEmpty()) emptyList() else s.split("\n")
              }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: BlokirTakDikenal-APK
          path: app/build/outputs/apk/debug/app-debug.apk
